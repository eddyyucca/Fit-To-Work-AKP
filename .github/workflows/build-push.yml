# CI/CD aplikasi ini (mandiri: hanya memakai isi repositori ini).
# Setiap push ke main: (1) GitHub membangun image dan mengunggahnya ke ghcr.io, (2) runner di server memanggil webhook
# Portainer supaya stack menarik image baru dan restart.
#
# Rahasia yang dibutuhkan (Settings > Secrets and variables > Actions):
#   GHCR_TOKEN              token classic dengan izin write:packages
#   PORTAINER_WEBHOOK_URL   alamat webhook stack di Portainer (pakai localhost, karena runner berada di server yang sama)
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # tombol "Run workflow" manual di tab Actions

env:
  IMAGE: akp-fittowork

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Berjalan di SERVER Windows (self-hosted runner; hanya koneksi KELUAR ke GitHub, tidak ada port yang dibuka).
  # Memanggil webhook stack Portainer di localhost: Portainer menarik image "latest" yang baru dan me-restart stack.
  deploy:
    needs: image
    runs-on: [self-hosted, windows, akp-server]
    steps:
      - name: Perbarui stack di Portainer
        shell: cmd
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          rem Portainer memakai sertifikat milik sendiri (https://localhost:9443): -k hanya untuk panggilan lokal ini.
          rem -f membuat langkah ini GAGAL bila Portainer membalas error (HTTP 4xx/5xx).
          curl.exe -k -sS -f --max-time 120 -X POST "%WEBHOOK%"
