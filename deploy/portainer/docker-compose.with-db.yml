# Stack Portainer FIT TO WORK + SQL SERVER SENDIRI (database ikut pindah ke stack ini).
# Pakai file ini HANYA setelah database lama di-backup dan siap dipulihkan (lihat langkah pindah database).
# Aplikasi TIDAK memakai login Portal. Wajib diisi: DB_PASSWORD (kata sandi sa baru, min. 8 karakter, huruf besar/kecil + angka).
services:
  db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}   # samakan dengan image SQL Server lama (docker inspect mssql2022)
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}    # sama dengan SQL Server lama (Developer, tanpa batas 10 GB)
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}   # samakan dengan collation server lama
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-1436}:1433"     # untuk DBeaver/SSMS lewat SSH tunnel (hanya localhost server)
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  fittowork:
    image: ghcr.io/eddyyucca/akp-fittowork:${FTW_TAG:-latest}
    pull_policy: always                 # selalu tarik image terbaru dari ghcr (Re-pull image di Portainer CE tidak tersedia)
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-FitToWorkDb};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      # Sinkron karyawan dari HRIS (REST API, baca-saja). HRIS berjalan di server yang sama, port HRIS_PORT di server (8101).
      HRIS_API_URL: "${HRIS_API_URL:-http://host.docker.internal:8101}"
      HRIS_API_TOKEN: "${HRIS_API_TOKEN:-}"
      # Sinkron otomatis tiap sekian menit (0 = mati). Tombol "Sinkron Sekarang" di menu admin tetap ada.
      HRIS_SYNC_INTERVAL_MINUTES: "${HRIS_SYNC_INTERVAL_MINUTES:-60}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Hanya dari server ini sendiri (cloudflared). Dari LAN / internet wajib lewat Cloudflare Tunnel.
      - "127.0.0.1:${APP_PORT:-8108}:8080"
    volumes:
      # Nama volume SAMA dengan yang dipakai docker-compose.production.yml lama, supaya lampiran dan kunci login tidak hilang.
      - fittowork-uploads:/app/App_Data/uploads
      - fittowork-keys:/app/App_Data/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/Account/EmployeeLogin"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mssql_data:
    name: akp_fittowork_mssql_data
  fittowork-uploads:
    name: fittowork-uploads
    external: true
  fittowork-keys:
    name: fittowork-keys
    external: true
